[package]
name = "figma2json"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
default-run = "f2j"
authors = ["mtalhazulf <talhazulf4163@gmail.com>"]
description = "CLI tool to convert Figma .fig files to LLM-friendly JSON format"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/obscode-io/figma2json"
homepage = "https://obscode-io.github.io/figma2json/"
documentation = "https://docs.rs/figma2json"
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]
keywords = ["figma", "converter", "json", "cli", "llm"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
anyhow = { version = "1.0", optional = true }
thiserror = "1.0"

zip = { version = "0.6", default-features = false, features = ["deflate"] }

flate2 = "1.0"
ruzstd = "0.9"

kiwi-schema = "0.2.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

base64 = "0.21"

clap = { version = "4.5", features = ["derive"], optional = true }

[dev-dependencies]
zstd = "0.13"

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap"]

[[bin]]
name = "figma2json"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "f2j"
path = "src/bin/f2j.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[workspace]
members = ["web"]

[profile.release]
lto = true
codegen-units = 1
strip = true
