[package]
name = "figma2json"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
authors = ["mtalhazulf <talhazulf4163@gmail.com>"]
description = "CLI tool to convert Figma .fig files to LLM-friendly JSON format"
license = "MIT"
readme = "README.md"
repository = "https://github.com/obsidian-code-io/figma2json"
keywords = ["figma", "converter", "json", "cli", "llm"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
anyhow = "1.0"
thiserror = "1.0"

zip = "0.6"

flate2 = "1.0"
zstd = "0.13"

kiwi-schema = "0.2.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

base64 = "0.21"

clap = { version = "4.5", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
