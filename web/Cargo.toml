[package]
name = "figma2json-web"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
authors = ["mtalhazulf <talhazulf4163@gmail.com>"]
description = "WebAssembly bindings for figma2json: convert Figma .fig files to JSON in the browser"
license = "Apache-2.0"
repository = "https://github.com/obscode-io/figma2json"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
figma2json = { path = "..", default-features = false }
serde_json = "1.0"
wasm-bindgen = "=0.2.100"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1.0"
kiwi-schema = "0.2.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
